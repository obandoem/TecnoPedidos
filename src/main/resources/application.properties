# Nombre de la aplicacion
spring.application.name=TecnoPedidos

# Puerto del servidor web
server.port=8080

# Credenciales locales: copiar application-local.example.properties
# como application-local.properties (no se sube a GitHub)
spring.config.import=optional:classpath:application-local.properties

# Conexion a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/tecnopedidos?serverTimezone=America/Costa_Rica
spring.datasource.username=root
spring.datasource.password=1152

# Configuracion de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false

# Archivos de idioma (messages.properties / messages_en.properties)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
# Sin esto, en una PC con Windows en ingles se mostraria messages_en
# aunque el idioma elegido sea espanol (no existe messages_es.properties)
spring.messages.fallback-to-system-locale=false

# Configuracion de logs
logging.pattern.dateformat=hh:mm
spring.main.banner-mode=off

# Firebase Storage. El bucket predeterminado se detecta por el proyecto;
# si se usa uno personalizado, defina FIREBASE_STORAGE_BUCKET.
firebase.storage.bucket=${FIREBASE_STORAGE_BUCKET:}

# Limites para imagenes de producto
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Correo (HU-17). El usuario y la contrasena van en application-local.properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Direccion del sistema para el enlace de seguimiento que va en el correo
app.url-base=http://localhost:8080

# En false el correo no se envia, solo se escribe en el log.
# Cada integrante lo activa en su application-local.properties
app.correo.activo=false
