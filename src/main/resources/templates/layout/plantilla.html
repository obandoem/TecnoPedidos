<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!--
    Plantilla comun con fragmentos reutilizables (diseno del prototipo de Figma).
    Estructura de cada vista:

      <head th:replace="~{layout/plantilla :: head('Titulo')}"></head>
      <body class="bg-light">
        <div class="d-flex">
          <aside th:replace="~{layout/plantilla :: sidebar('inventario')}"></aside>
          <div class="flex-grow-1" style="min-width: 0;">
            <header th:replace="~{layout/plantilla :: topbar}"></header>
            <main class="p-4"> ... contenido ... </main>
          </div>
        </div>
        <th:block th:replace="~{layout/plantilla :: scripts}"></th:block>
      </body>

    Valores de 'activo': inicio, inventario, clientes, pedidos, bajoStock, misPedidos
    Variables globales (DatosGlobalesAdvice): usuarioNombre, usuarioRol, esAdmin,
    esVendedor, esTecnico, nombreEmpresa, cantidadBajoStock
-->

<!-- Encabezado: metadatos, Bootstrap y Bootstrap Icons -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - TecnoPedidos'">TecnoPedidos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">
</head>

<body>

    <!--
        Barra lateral de navegacion. Cada opcion se muestra segun el rol (HU-01).
        En pantallas grandes queda fija a la izquierda; en pantallas pequenas
        se abre como panel (offcanvas) con el boton de la barra superior.
    -->
    <aside th:fragment="sidebar(activo)"
           class="offcanvas-lg offcanvas-start" id="menuLateral" tabindex="-1"
           style="--bs-offcanvas-width: 260px;">

        <div class="offcanvas-body p-0">
            <div class="d-flex flex-column bg-dark text-white p-3 sticky-top"
                 style="width: 260px; height: 100vh; overflow-y: auto;">

                <!-- Marca -->
                <div class="d-flex align-items-center justify-content-between mb-4">
                    <a th:href="@{/}" class="d-flex align-items-center text-white text-decoration-none">
                        <span class="bg-primary rounded-3 d-inline-flex align-items-center justify-content-center me-2"
                              style="width: 36px; height: 36px;">
                            <i class="bi bi-grid-fill"></i>
                        </span>
                        <span class="fs-5 fw-bold" th:text="#{app.nombre}">TecnoPedidos</span>
                    </a>
                    <button type="button" class="btn-close btn-close-white d-lg-none"
                            data-bs-dismiss="offcanvas" data-bs-target="#menuLateral"></button>
                </div>

                <!-- Empresa de la sesion -->
                <div class="border border-secondary rounded-3 p-2 mb-4 d-flex align-items-center">
                    <span class="bg-info-subtle text-info-emphasis rounded-2 d-inline-flex align-items-center justify-content-center me-2"
                          style="width: 34px; height: 34px;">
                        <i class="bi bi-building"></i>
                    </span>
                    <div class="lh-sm">
                        <div class="text-uppercase text-secondary fw-semibold" style="font-size: .7rem;"
                             th:text="#{menu.empresa}">Empresa</div>
                        <div class="fw-semibold small" th:text="${nombreEmpresa}">Empresa</div>
                    </div>
                </div>

                <div class="text-uppercase text-secondary fw-semibold mb-2" style="font-size: .7rem;"
                     th:text="#{menu.navegacion}">Navegación</div>

                <ul class="nav nav-pills flex-column gap-1 mb-auto">

                    <!-- Administrador y vendedor -->
                    <th:block th:if="${esAdmin or esVendedor}">
                        <li class="nav-item">
                            <a th:href="@{/}" class="nav-link text-white d-flex align-items-center"
                               th:classappend="${activo == 'inicio'} ? 'active'">
                                <i class="bi bi-grid me-2"></i><span th:text="#{menu.inicio}">Inicio</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/productos}" class="nav-link text-white d-flex align-items-center"
                               th:classappend="${activo == 'inventario'} ? 'active'">
                                <i class="bi bi-box-seam me-2"></i><span th:text="#{menu.inventario}">Inventario</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/clientes}" class="nav-link text-white d-flex align-items-center"
                               th:classappend="${activo == 'clientes'} ? 'active'">
                                <i class="bi bi-people me-2"></i><span th:text="#{menu.clientes}">Clientes</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/pedidos}" class="nav-link text-white d-flex align-items-center"
                               th:classappend="${activo == 'pedidos'} ? 'active'">
                                <i class="bi bi-cart me-2"></i><span th:text="#{menu.pedidos}">Pedidos</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/inventario/bajo-stock}" class="nav-link text-white d-flex align-items-center"
                               th:classappend="${activo == 'bajoStock'} ? 'active'">
                                <i class="bi bi-exclamation-triangle me-2"></i><span th:text="#{menu.bajoStock}">Bajo stock</span>
                                <span th:if="${cantidadBajoStock != null and cantidadBajoStock > 0}"
                                      class="badge rounded-pill text-bg-danger ms-auto"
                                      th:text="${cantidadBajoStock}">0</span>
                            </a>
                        </li>
                    </th:block>

                    <!-- Tecnico -->
                    <li class="nav-item" th:if="${esTecnico}">
                        <a th:href="@{/tecnico/pedidos}" class="nav-link text-white d-flex align-items-center"
                           th:classappend="${activo == 'misPedidos'} ? 'active'">
                            <i class="bi bi-tools me-2"></i><span th:text="#{menu.misPedidos}">Mis pedidos</span>
                        </a>
                    </li>

                    <!-- Administracion de usuarios (P09 / HU-11, prioridad media): pendiente -->
                    <li class="nav-item" th:if="${esAdmin}">
                        <a class="nav-link disabled text-secondary d-flex align-items-center" aria-disabled="true">
                            <i class="bi bi-gear me-2"></i><span th:text="#{menu.administracion}">Administración</span>
                            <i class="bi bi-lock ms-auto small" th:title="#{menu.proximamente}"></i>
                        </a>
                    </li>
                </ul>

                <!-- Usuario autenticado y cierre de sesion -->
                <div class="border-top border-secondary pt-3 mt-3 d-flex align-items-center">
                    <span class="rounded-circle bg-primary-subtle text-primary-emphasis fw-bold small d-inline-flex align-items-center justify-content-center me-2 flex-shrink-0"
                          style="width: 36px; height: 36px;"
                          th:text="${usuarioNombre != null} ? ${#strings.substring(usuarioNombre, 0, 1)} : '?'">U</span>
                    <div class="small lh-sm flex-grow-1" style="min-width: 0;">
                        <div class="fw-semibold text-truncate" th:text="${usuarioNombre}">Usuario</div>
                        <div class="text-secondary" th:if="${usuarioRol != null}"
                             th:text="#{${'rol.' + usuarioRol}}">Rol</div>
                    </div>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-sm btn-outline-secondary text-white border-0"
                                th:title="#{menu.salir}">
                            <i class="bi bi-box-arrow-right"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </aside>

    <!-- Barra superior: boton de menu (pantallas pequenas) e idioma -->
    <header th:fragment="topbar"
            class="bg-white border-bottom px-4 py-2 d-flex align-items-center sticky-top">
        <button class="btn btn-outline-secondary btn-sm d-lg-none me-2" type="button"
                data-bs-toggle="offcanvas" data-bs-target="#menuLateral">
            <i class="bi bi-list"></i>
        </button>

        <div class="ms-auto d-flex align-items-center gap-3">
            <span class="small text-secondary d-none d-md-inline">
                <i class="bi bi-circle-fill text-success me-1" style="font-size: .5rem;"></i>
                <span th:text="#{topbar.sistema}">Sistema actualizado</span>
            </span>
            <th:block th:replace="~{layout/plantilla :: idioma}"></th:block>
        </div>
    </header>

    <!-- Selector de idioma (HU-16) -->
    <div th:fragment="idioma" class="dropdown">
        <button class="btn btn-sm btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
            <i class="bi bi-globe me-1"></i>
            <span th:text="${#locale.language.toUpperCase()}">ES</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="?lang=es">Español</a></li>
            <li><a class="dropdown-item" href="?lang=en">English</a></li>
        </ul>
    </div>

    <!-- Mensajes de exito y error enviados con RedirectAttributes -->
    <div th:fragment="mensajes">
        <div th:if="${mensaje != null}"
             class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle me-1"></i>
            <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${error != null}"
             class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-circle me-1"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    </div>

    <!-- Badge del estado de un pedido -->
    <th:block th:fragment="estadoBadge(estado)" th:switch="${estado.name()}">
        <span th:case="'PENDIENTE'" class="badge rounded-pill bg-warning-subtle text-warning-emphasis"
              th:text="'● ' + #{estado.PENDIENTE}">Pendiente</span>
        <span th:case="'ASIGNADO'" class="badge rounded-pill bg-info-subtle text-info-emphasis"
              th:text="'● ' + #{estado.ASIGNADO}">Asignado</span>
        <span th:case="'EN_PROCESO'" class="badge rounded-pill bg-primary-subtle text-primary-emphasis"
              th:text="'● ' + #{estado.EN_PROCESO}">En proceso</span>
        <span th:case="'LISTO'" class="badge rounded-pill bg-success-subtle text-success-emphasis"
              th:text="'● ' + #{estado.LISTO}">Listo</span>
        <span th:case="'ENTREGADO'" class="badge rounded-pill bg-secondary-subtle text-secondary-emphasis"
              th:text="'● ' + #{estado.ENTREGADO}">Entregado</span>
        <span th:case="'CANCELADO'" class="badge rounded-pill bg-danger-subtle text-danger-emphasis"
              th:text="'● ' + #{estado.CANCELADO}">Cancelado</span>
    </th:block>

    <!-- Historial de estados de un pedido (HU-09); 'internas' muestra observaciones internas -->
    <div th:fragment="historial(pedido)">
        <div th:if="${#lists.isEmpty(pedido.seguimientos)}" class="text-secondary small"
             th:text="#{comun.sinResultados}">Sin registros</div>
        <ul class="list-unstyled mb-0">
            <li th:each="s : ${pedido.seguimientos}" class="border-start border-2 border-primary ps-3 pb-3 position-relative">
                <div class="small text-secondary">
                    <span th:text="${#temporals.format(s.fecha, 'dd/MM/yyyy HH:mm')}"></span>
                    <span th:if="${s.usuario != null}" th:text="' · ' + ${s.usuario.nombre}"></span>
                </div>
                <div class="d-flex align-items-center gap-1 my-1">
                    <th:block th:if="${s.estadoAnterior != null and s.estadoAnterior != s.estadoNuevo}">
                        <th:block th:replace="~{layout/plantilla :: estadoBadge(${s.estadoAnterior})}"></th:block>
                        <i class="bi bi-arrow-right small text-secondary"></i>
                    </th:block>
                    <th:block th:replace="~{layout/plantilla :: estadoBadge(${s.estadoNuevo})}"></th:block>
                </div>
                <div th:if="${s.comentarioPublico != null}" class="small">
                    <i class="bi bi-chat-left-text me-1 text-secondary"></i><span th:text="${s.comentarioPublico}"></span>
                </div>
                <div th:if="${s.observacionInterna != null}" class="small text-secondary fst-italic">
                    <i class="bi bi-lock me-1"></i><span th:text="${s.observacionInterna}"></span>
                </div>
            </li>
        </ul>
    </div>

    <!-- Scripts de Bootstrap -->
    <th:block th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </th:block>

</body>
</html>
